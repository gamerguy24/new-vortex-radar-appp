<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Vortex Radar</title>
  <link rel="icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    :root {
      --primary: #27beff;
      --bg: #0b1220;
      --panel: rgba(15, 23, 35, 0.72);
      --border: rgba(255,255,255,0.12);
      --text: #e7eef7;
      --muted: rgba(231, 238, 247, 0.6);
      --error: #f87171;
      --success: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at 20% 0%, rgba(39,190,255,0.18), transparent 50%),
        radial-gradient(circle at 80% 100%, rgba(124,58,237,0.16), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'Onest', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* On phones or short viewports (e.g. when the on-screen keyboard is up),
       pin the card to the top so the email/tabs at the top of the card are
       always reachable instead of being clipped above the viewport. */
    @media (max-width: 600px), (max-height: 760px) {
      body { align-items: flex-start; }
    }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand img { width: min(280px, 70vw); height: auto; }
    .card {
      width: min(420px, 92vw);
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 4px; font-size: 1.6em; }
    .sub { color: var(--muted); margin-bottom: 22px; font-size: 0.95em; }
    .tabs { display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.3); border-radius: 10px; margin-bottom: 18px; }
    .tab {
      flex: 1; padding: 8px 10px; border-radius: 8px; text-align: center;
      cursor: pointer; color: var(--muted); font-weight: 600; font-size: 0.95em;
      user-select: none;
    }
    .tab.active { background: var(--primary); color: #001022; }
    label { display: block; font-size: 0.85em; color: var(--muted); margin-top: 12px; margin-bottom: 6px; }
    input[type="email"], input[type="password"] {
      width: 100%; padding: 11px 12px; border-radius: 8px;
      background: rgba(0,0,0,0.35); border: 1px solid var(--border);
      color: var(--text); font-size: 1em; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button.primary {
      width: 100%; margin-top: 18px; padding: 12px;
      background: var(--primary); color: #001022; border: none;
      border-radius: 8px; font-weight: 700; font-size: 1em;
      cursor: pointer;
    }
    button.primary:hover { background: #4ad0ff; }
    button.primary:disabled { opacity: 0.6; cursor: wait; }
    .msg { margin-top: 14px; font-size: 0.9em; min-height: 1.2em; }
    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }
    .help {
      margin-top: 22px; padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.88em; color: var(--muted); line-height: 1.5;
    }
    .help a { color: var(--primary); text-decoration: none; }
    .help a:hover { text-decoration: underline; }
    .form { display: none; }
    .form.active { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/logo.png" alt="Vortex Radar" /></div>
    <div class="card">
    <h1>Vortex Radar</h1>
    <p class="sub">Sign in to access the radar.</p>

    <div class="tabs" role="tablist">
      <div class="tab active" data-tab="login" role="tab">Sign in</div>
      <div class="tab" data-tab="register" role="tab">Create account</div>
      <div class="tab" data-tab="admin" role="tab">Admin</div>
    </div>

    <form class="form active" id="login-form" autocomplete="on">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" required autocomplete="email" />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" required autocomplete="current-password" />
      <button class="primary" type="submit">Sign in</button>
      <div class="msg" id="login-msg" role="alert"></div>
    </form>

    <form class="form" id="register-form" autocomplete="on">
      <label for="register-email">Email</label>
      <input id="register-email" name="email" type="email" required autocomplete="email" />
      <label for="register-password">Password (10+ characters)</label>
      <input id="register-password" name="password" type="password" required minlength="10" autocomplete="new-password" />
      <button class="primary" type="submit">Create account</button>
      <div class="msg" id="register-msg" role="alert"></div>
    </form>

    <form class="form" id="admin-form" autocomplete="on">
      <p class="sub" style="margin: -6px 0 14px;">Sign in to an admin account. You'll land in the in-app admin panel.</p>
      <label for="admin-email">Admin email</label>
      <input id="admin-email" name="email" type="email" required autocomplete="email" />
      <label for="admin-password">Password</label>
      <input id="admin-password" name="password" type="password" required autocomplete="current-password" />
      <button class="primary" type="submit">Sign in as admin</button>
      <div class="msg" id="admin-msg" role="alert"></div>
    </form>

    <form class="form" id="forgot-form" autocomplete="on">
      <p class="sub" style="margin: -6px 0 14px;">Enter the email on your account. An admin will issue you a temporary password and contact you at <a id="support-link" href="#" style="color: var(--primary);">support</a>.</p>
      <label for="forgot-email">Email</label>
      <input id="forgot-email" name="email" type="email" required autocomplete="email" />
      <button class="primary" type="submit">Request password reset</button>
      <div class="msg" id="forgot-msg" role="alert"></div>
    </form>

    <div class="help">
      <a href="#" id="forgot-link">Forgot your password?</a>
    </div>
    </div>
  </main>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const forms = {
      login: document.getElementById('login-form'),
      register: document.getElementById('register-form'),
      admin: document.getElementById('admin-form'),
      forgot: document.getElementById('forgot-form')
    };
    function activateTab(name) {
      tabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
      Object.entries(forms).forEach(([k, f]) => f.classList.toggle('active', k === name));
    }
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => activateTab(tab.dataset.tab));
    });

    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      activateTab('forgot');
    });

    function setMsg(id, text, kind) {
      const el = document.getElementById(id);
      el.textContent = text || '';
      el.className = 'msg' + (kind ? ' ' + kind : '');
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'same-origin'
      });
      let data = null;
      try { data = await res.json(); } catch {}
      return { ok: res.ok, status: res.status, data };
    }

    forms.login.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = forms.login.querySelector('button');
      btn.disabled = true;
      setMsg('login-msg', '');
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { ok, data } = await postJson('/auth/login', { email, password });
      btn.disabled = false;
      if (!ok) {
        setMsg('login-msg', data?.error || 'Sign in failed.', 'error');
        return;
      }
      window.location.href = '/';
    });

    forms.register.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = forms.register.querySelector('button');
      btn.disabled = true;
      setMsg('register-msg', '');
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const { ok, data } = await postJson('/auth/register', { email, password });
      btn.disabled = false;
      if (!ok) {
        setMsg('register-msg', data?.error || 'Could not create account.', 'error');
        return;
      }
      window.location.href = '/';
    });

    forms.forgot.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = forms.forgot.querySelector('button');
      btn.disabled = true;
      setMsg('forgot-msg', '');
      const email = document.getElementById('forgot-email').value;
      const { ok } = await postJson('/auth/forgot', { email });
      btn.disabled = false;
      if (!ok) {
        setMsg('forgot-msg', 'Could not submit request. Try again later.', 'error');
        return;
      }
      setMsg('forgot-msg', 'Request received. If an account exists for that email, an admin will issue a temporary password and contact you.', 'success');
      forms.forgot.querySelector('button').disabled = true;
    });

    forms.admin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = forms.admin.querySelector('button');
      btn.disabled = true;
      setMsg('admin-msg', '');
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const { ok, data } = await postJson('/auth/login', { email, password });
      if (!ok) {
        btn.disabled = false;
        setMsg('admin-msg', data?.error || 'Sign in failed.', 'error');
        return;
      }
      if (!data?.user?.isAdmin) {
        // Logged in successfully but not an admin — sign back out and refuse.
        await postJson('/auth/logout', {});
        btn.disabled = false;
        setMsg('admin-msg', 'This account does not have admin access.', 'error');
        return;
      }
      // Admin confirmed — land directly in the in-app admin panel.
      window.location.href = '/#admin';
    });

    fetch('/auth/support', { headers: { 'Accept': 'application/json' } })
      .then((r) => r.json())
      .then((data) => {
        const link = document.getElementById('support-link');
        if (data?.supportEmail) {
          link.href = 'mailto:' + data.supportEmail + '?subject=Password%20reset%20request';
          link.textContent = data.supportEmail;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
