# Post every push to the radar-development-updates Discord channel.
#
# Runs on GitHub, so it catches EVERY push to this repo — from any machine,
# not just the one a local git hook happens to be installed on.
#
# SETUP (once): add the webhook URL as a repository secret named
# DISCORD_WEBHOOK_URL —
#   GitHub → this repo → Settings → Secrets and variables → Actions →
#   New repository secret.
# The URL is a password: anyone holding it can post to the channel, so it must
# never be committed. Without the secret this workflow simply does nothing.
name: Discord update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    # Resolved once for every step. The fallbacks are deliberate: this went
    # unnoticed because the secret was believed to be set, and the likely
    # mistakes are a different name or a repository VARIABLE instead of a
    # secret. Any of these works.
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK_URL || vars.DISCORD_WEBHOOK }}
    steps:
      # Fail HERE, before anything else, when there is nowhere to post. A
      # failure buried in the posting step stopped the job and skipped the
      # release-notes step with it, which read as "What's New never posts".
      - name: Check the webhook is configured
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::No Discord webhook configured. Add the webhook URL to this REPOSITORY as a secret named DISCORD_WEBHOOK_URL (Settings -> Secrets and variables -> Actions -> New repository secret). Checked: secrets.DISCORD_WEBHOOK_URL, secrets.DISCORD_WEBHOOK, vars.DISCORD_WEBHOOK_URL, vars.DISCORD_WEBHOOK."
            exit 1
          fi
          echo "webhook configured"

      # Full history: the release-notes check below diffs this push against
      # what came before it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Did this push touch the release notes? Decided with git rather than a
      # payload expression — github.event.commits.*.modified is an array OF
      # ARRAYS, and joining it did not produce the string the match needed, so
      # the step silently skipped every time.
      - name: Did the release notes change?
        id: notes
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            range="${{ github.sha }}~1 ${{ github.sha }}"
          else
            range="$before ${{ github.sha }}"
          fi
          if git diff --name-only $range | grep -qx 'app/core/changelog/changelog.js'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "release notes changed in this push"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "release notes unchanged"
          fi

      # WEBHOOK comes from the job-level env, so the fallbacks there apply.
      - name: Post the commits to Discord
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = process.env.WEBHOOK;   // checked in the first step
            if (!webhook) {
              /*
               * FAIL, do not shrug. This used to log a line and return, so the
               * run went green while the channel stayed empty — indistinguishable
               * from working, and the hardest kind of thing to notice.
               */
              core.setFailed('DISCORD_WEBHOOK_URL secret is not set on this repository, '
                + 'so nothing was posted. Add it under Settings → Secrets and variables → Actions.');
              return;
            }
            const p = context.payload;
            const commits = p.commits || [];
            if (!commits.length) {
              core.info('No commits in this push (branch create/delete) — nothing posted.');
              return;
            }

            // First line only: commit bodies here are long by design.
            const lines = commits.map((c) => {
              const title = String(c.message || '').split('\n')[0].slice(0, 140);
              return `[\`${c.id.slice(0, 7)}\`](${c.url}) ${title} — ${c.author && c.author.name || 'unknown'}`;
            });
            // Discord embeds cap at 4096 characters; leave room for the tail.
            let description = '';
            let shown = 0;
            for (const line of lines) {
              if (description.length + line.length > 3800) break;
              description += line + '\n';
              shown++;
            }
            if (shown < lines.length) description += `…and ${lines.length - shown} more\n`;

            const branch = (p.ref || '').replace('refs/heads/', '');
            const body = {
              username: 'Echo Radar',
              embeds: [{
                title: `${commits.length} commit${commits.length === 1 ? '' : 's'} pushed to ${branch}`,
                url: p.compare,
                description,
                color: 0x27beff,
                footer: { text: `${context.repo.owner}/${context.repo.repo} · pushed by ${p.pusher && p.pusher.name || 'unknown'}` },
                timestamp: new Date().toISOString(),
              }],
            };

            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              core.setFailed(`Discord replied ${res.status}: ${(await res.text()).slice(0, 300)}`);
            } else {
              core.info(`Posted ${commits.length} commit(s) to Discord.`);
            }

      # Commit subjects are written for us; What's New is written for the people
      # using the radar. When a push actually changes the release notes, post
      # those too — the same text the app shows under What's New.
      - name: Post What's New when the release notes changed
        if: steps.notes.outputs.changed == 'true'
        env:
          # The script reads DISCORD_WEBHOOK_URL; feed it whichever name the
          # repository actually has (resolved at job level).
          DISCORD_WEBHOOK_URL: ${{ env.WEBHOOK }}
        run: node tools/post_discord_update.js --changelog 1
