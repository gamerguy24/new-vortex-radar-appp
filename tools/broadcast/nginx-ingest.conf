# echo-radar-ingest — the web side of the Chase Stream Hub's RTMP server.
# Installed by tools/broadcast/install_ingest.sh as
# /etc/nginx/conf.d/echo-radar-ingest.conf (inside nginx's http block), with
# CHANGE_ME_TO_THE_SAME_SECRET and https://echoradarwx.com filled in.
#
# Both servers listen on 127.0.0.1 only: nothing here faces the internet
# directly, so there is no certificate, no port 80/443 and no DNS record to
# manage.

# Key checks from nginx's RTMP side, relayed to Echo Radar over HTTPS (the
# RTMP module can only call plain http). The tunnel does not point here.
server {
    listen 127.0.0.1:8098;
    access_log off;

    location = /publish {
        proxy_pass https://echoradarwx.com/internal/rtmp/publish;
        proxy_ssl_server_name on;
        proxy_set_header X-Ingest-Secret "CHANGE_ME_TO_THE_SAME_SECRET";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}

map $uri $echo_hls_cache {
    ~\.m3u8$ "no-cache";
    default  "private, max-age=60";
}

# What this box's Cloudflare Tunnel publishes as https://stream.echoradarwx.com.
server {
    listen 127.0.0.1:8099;
    server_tokens off;
    access_log off;

    # Which streams are arriving, for Echo Radar's "Receiving your stream".
    location = /stat {
        if ($http_x_ingest_secret != "CHANGE_ME_TO_THE_SAME_SECRET") { return 403; }
        rtmp_stat all;
        add_header Cache-Control "no-store" always;
    }

    # HLS for viewers: /w/<expiry>/<signature>/<id>/<file>, signed by Echo
    # Radar for signed-in users. Playlists are relative, so the segments come
    # back under the same signed folder.
    location ~ "^/w/(?<er_exp>[0-9]+)/(?<er_sig>[A-Za-z0-9_-]{22})/(?<er_id>[a-f0-9]{10})/(?<er_file>[A-Za-z0-9_-]+\.(?:m3u8|ts))$" {
        secure_link $er_sig,$er_exp;
        secure_link_md5 "$er_exp $er_id CHANGE_ME_TO_THE_SAME_SECRET";
        if ($secure_link = "")  { return 403; }   # bad signature
        if ($secure_link = "0") { return 410; }   # expired: reopen the stream
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control $echo_hls_cache always;
        alias /var/lib/echo-hls/$er_id/$er_file;
    }

    location / { return 404; }
}
