# echo-radar-ingest — RTMP for the Chase Stream Hub, on the broadcast box.
# Installed by tools/broadcast/install_ingest.sh as /etc/nginx/echo-radar-rtmp.conf
# and included at the END of nginx.conf (an rtmp block must sit outside http).
#
# OBS publishes to rtmp://<this box>/live with the key "<id>?pass=<secret>".
# nginx asks Echo Radar about every stream start (on_publish, through the local
# relay in echo-radar-ingest.conf) and writes HLS to /var/lib/echo-hls/<id>/,
# which the tunnel-facing server in echo-radar-ingest.conf serves to viewers.
# Nobody can pull RTMP from here; viewers only get HLS with a signed link.

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            deny play all;

            # Echo Radar says yes (2xx) or no to each stream key.
            on_publish http://127.0.0.1:8098/publish;
            drop_idle_publisher 15s;

            # Needs H.264 + AAC (OBS's defaults) and a 2 s keyframe interval.
            hls on;
            hls_path /var/lib/echo-hls;
            hls_nested on;
            hls_fragment 2s;
            hls_playlist_length 12s;
            hls_cleanup on;
        }
    }
}
