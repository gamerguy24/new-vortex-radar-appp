# MediaMTX config for Echo Radar's RTMP server (Chase Stream Hub).
# Setup: tools/RTMP_SETUP.md — tools/broadcast/install_ingest.sh installs it
# on the 24/7 broadcast box and fills in the secret and addresses.
#
# OBS sends RTMP to :1935. MediaMTX asks Echo Radar whether each stream key may
# publish and each viewer may watch (authHTTPAddress), and serves HLS on
# 127.0.0.1:8888, which Caddy puts on https://ingest.echoradarwx.com.

logLevel: info
logDestinations: [stdout]

# Every publish and read is checked by Echo Radar. The secret must be the
# SAME value as MEDIAMTX_HOOK_SECRET in Echo Radar's .env. If MediaMTX runs on
# the same box as Echo Radar, http://127.0.0.1:3333 works here too.
authMethod: http
authHTTPAddress: https://echoradarwx.com/internal/mediamtx/auth?secret=CHANGE_ME_TO_THE_SAME_SECRET
authHTTPExclude: []

# Control API: Echo Radar polls it (with the secret) to show "Receiving your
# stream". Local; Caddy forwards /v3/ to it.
api: yes
apiAddress: 127.0.0.1:9997
apiTrustedProxies: ['127.0.0.1']
metrics: no
pprof: no
playback: no

# Ingest: RTMP only, open to the internet on port 1935.
rtmp: yes
rtmpAddress: :1935
rtsp: no
webrtc: no
srt: no
moq: no

# Output: HLS for Echo Radar's in-app player. Local; Caddy serves it over
# HTTPS. Each viewer needs a watch token signed by Echo Radar.
hls: yes
hlsAddress: 127.0.0.1:8888
hlsTrustedProxies: ['127.0.0.1']
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 2s

pathDefaults:
  source: publisher

paths:
  # Streams arrive as live/<id>; Echo Radar refuses any id or password it did not issue.
  all_others:
